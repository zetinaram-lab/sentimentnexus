<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="256" fill="url(#gradient1)"/>
  
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradient1" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0A0F1C"/>
      <stop offset="100%" stop-color="#1A2332"/>
    </linearGradient>
    <linearGradient id="gradient2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  
  <!-- Modern S Letter -->
  <path d="M 280 140 C 360 140 400 180 400 240 C 400 280 380 310 340 330 C 380 350 400 380 400 430 C 400 490 360 530 280 530 C 200 530 160 490 160 430" 
        stroke="url(#gradient2)" 
        stroke-width="24" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none"/>
  
  <!-- Nexus Connection Dots -->
  <circle cx="180" cy="200" r="8" fill="#22D3EE"/>
  <circle cx="332" cy="256" r="8" fill="#22D3EE"/>
  <circle cx="180" cy="312" r="8" fill="#22D3EE"/>
  
  <!-- Connection Lines -->
  <line x1="180" y1="200" x2="332" y2="256" stroke="#22D3EE" stroke-width="2" opacity="0.3"/>
  <line x1="332" y1="256" x2="180" y2="312" stroke="#22D3EE" stroke-width="2" opacity="0.3"/>
  
  <!-- Subtle Glow Effect -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.1"/>
</svg>
