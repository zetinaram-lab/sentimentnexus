<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="#0A0F1C"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>
  
  <!-- Signal wave -->
  <g transform="translate(100, 256)">
    <line x1="0" y1="0" x2="312" y2="0" stroke="#22D3EE" stroke-width="3" opacity="0.3"/>
    <path d="M 0,0 Q 52,-80 104,-80 T 208,0 T 312,0" 
          stroke="url(#cyanGrad)" 
          stroke-width="6" 
          fill="none" 
          stroke-linecap="round"/>
    <circle cx="104" cy="-80" r="8" fill="#22D3EE"/>
    <circle cx="208" cy="0" r="8" fill="#06B6D4"/>
    <circle cx="312" cy="0" r="8" fill="#22D3EE"/>
    <circle cx="104" cy="-80" r="16" fill="#22D3EE" opacity="0.2"/>
  </g>
  
  <!-- SN text -->
  <text x="256" y="360" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#22D3EE" text-anchor="middle" letter-spacing="4">SN</text>
</svg>
